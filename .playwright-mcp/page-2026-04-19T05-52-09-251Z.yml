        - generic [ref=e159]:
          - text: To reduce
          - code [ref=e160]: 429 Too Many Requests
          - text: "responses:"
        - list [ref=e161]:
          - listitem [ref=e162]: Spread traffic across the full minute instead of burst-sending.
          - listitem [ref=e163]: Use retry logic with exponential backoff and jitter.
          - listitem [ref=e164]: Keep request queues bounded.
          - listitem [ref=e165]: Add circuit breakers around non-critical enrichment flows.
          - listitem [ref=e166]:
            - text: Monitor request logs and alert on sustained
            - code [ref=e167]: "429"
            - text: rates.
        - heading "Navigate to header Client-side best practices" [level=2] [ref=e168]:

          - heading "Getting Started" [level=1] [ref=e34]
          - paragraph [ref=e35]: The Crustdata API provides comprehensive, programmatic access to a vast array of firmographic data and growth metrics for companies worldwide. Drawing from over 16 diverse datasets, including headcount metrics, employer reviews, product reviews, social media metrics, web traffic analytics, App Store reviews, Play Store data, and news sources, our API offers a holistic view of company performance and market presence. This rich data ecosystem enables deep insights into company structures, industry positioning, social media impact, and growth trajectories.
          - paragraph [ref=e36]: "To illustrate the breadth and structure of data available through the Crustdata API, consider the following mind map:"
          - paragraph [ref=e37]: This comprehensive documentation outlines the various API endpoints available through the Crustdata API, detailing the request parameters and response schemas for each call. It serves as your guide to effectively integrate and leverage our extensive dataset in your applications.

            - code [ref=e88]: DEPARTMENT_HEADCOUNT
            - text: filter, the
            - strong [ref=e89]: sub_filter
            - text: specifies which department the filter applies to. Ensure that you correctly pass
            - strong [ref=e90]: sub_filter
            - text: if required.

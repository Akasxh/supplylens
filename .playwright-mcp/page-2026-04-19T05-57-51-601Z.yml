              - text: "#"
          - list [ref=e52]:
            - listitem [ref=e53]:
              - code [ref=e54]: in
              - text: ": To include values."
            - listitem [ref=e55]:
              - code [ref=e56]: not in
              - text: ": To exclude values. Excluding values might not be supported for every filter."
          - heading "Example:Direct link to Example:" [level=4] [ref=e57]:
            - text: "Example:"
            - link "Direct link to Example:" [ref=e58] [cursor=pointer]:
              - /url: "#example"
              - text: "#"

            - link "Direct link to Text Filter" [ref=e43] [cursor=pointer]:
              - /url: "#text-filter"
              - text: "#"
          - paragraph [ref=e44]:
            - text: A
            - strong [ref=e45]: text filter
            - text: is used to filter based on specific text values. Each
            - strong [ref=e46]: text filter
            - text: must contain
            - strong [ref=e47]: filter_type
            - text: ","
            - strong [ref=e48]: type
            - text: and list of
            - strong [ref=e49]: value
            - text: .
          - heading "Valid Types:Direct link to Valid Types:" [level=4] [ref=e50]:

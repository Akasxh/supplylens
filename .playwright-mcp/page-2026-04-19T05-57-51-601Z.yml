            - strong [ref=e79]: filter_type
            - text: ","
            - strong [ref=e80]: type
            - text: and
            - strong [ref=e81]: value
            - text: . Few range filters might contain a
            - strong [ref=e82]: sub_filter
            - text: . Ensure that you correctly pass
            - strong [ref=e83]: sub_filter
            - text: if required.
          - heading "sub_filterDirect link to sub_filter" [level=4] [ref=e84]:

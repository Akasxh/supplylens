                    - /url: "#faq"
                - paragraph [ref=e203]:
                  - strong [ref=e204]: "Q: What's the maximum number of URLs I can fetch in one request?"
                  - text: "A: You can fetch up to 10 URLs per request."
                - paragraph [ref=e205]:
                  - strong [ref=e206]: "Q: How long does it take to fetch a page?"
                  - text: "A: Most pages are fetched within 2-5 seconds. Complex pages with lots of JavaScript may take longer."
                - paragraph [ref=e207]:
                  - strong [ref=e208]: "Q: Do I need to include the protocol in URLs?"
                  - text: "A: Yes, all URLs must start with"
                  - code [ref=e209]: http://
                  - text: or
                  - code [ref=e210]: https://
                  - text: .
                - paragraph [ref=e211]:
                  - strong [ref=e212]: "Q: What happens if one URL fails in a batch request?"
                  - text: "A: The successful URLs will return their content, and failed URLs will have"
                  - code [ref=e213]: "\"success\": false"
                  - text: with an error message. You still pay credits for successful fetches.
                - paragraph [ref=e214]:
                  - strong [ref=e215]: "Q: Will I be charged for failed fetches?"
                  - text: "A: This depends on the failure type. Network errors and invalid URLs typically don't consume credits, but rate limits and timeouts may."
                - paragraph [ref=e216]:
                  - strong [ref=e217]: "Q: Can I fetch content from password-protected pages?"
                  - text: "A: No, this API fetches publicly accessible pages only. Authentication is not supported."
                - paragraph [ref=e218]:
                  - strong [ref=e219]: "Q: What's the maximum page size that can be fetched?"
                  - text: "A: There are reasonable limits to prevent abuse, but typical webpages (up to several MB) should work fine."
                - paragraph [ref=e220]:
                  - strong [ref=e221]: "Q: How do I handle relative URLs in the fetched content?"
                  - text: "A: You'll need to resolve relative URLs yourself using the base URL from the"
                  - code [ref=e222]: url
                  - text: field in the response.
                - paragraph [ref=e223]:
                  - strong [ref=e224]: "Q: Can I specify custom headers or user agents?"
                  - text: "A: Custom headers are not currently supported. The API uses a standard user agent."

      - generic [ref=e341]:
        - heading "Identify companies actively scaling specific departments" [level=3] [ref=e344]
        - paragraph [ref=e346]: Use filters like job title, job category and number of openings to spot companies rapidly hiring in sales, engineering, or other functions. This is useful as a signal for outbound and for offering your recruiting services. For investment it’s a strong signal of company growth.
      - generic [ref=e358]:
        - heading "Track companies expanding into new markets" [level=3] [ref=e361]:
          - text: Track companies expanding
          - text: into new markets
        - paragraph [ref=e363]: Filter by job locations and look for listings in countries, cities or regions the company hasn’t previously hired in. This is useful for location-based outreach. For investors, it’s a sign of domestic or international expansion of the company.
      - generic [ref=e365]:
        - heading "Find companies hiring for remote-first roles" [level=3] [ref=e368]:
          - text: Find companies hiring
          - text: for remote-first roles
        - paragraph [ref=e370]: Use the workplace type filter to identify fully remote opportunities. This is useful for recruitment platforms indexing remote jobs or recruiters sourcing global candidates.
      - generic [ref=e382]:
        - heading "Discover early signals of new team formation" [level=4] [ref=e385]:
          - text: Discover early signals of
          - text: new team formation
        - paragraph [ref=e387]: Spot listings for new roles like “Founding Product Designer” or “First AE” to find companies building out early teams. This is useful for outbound sales or early-stage investors.

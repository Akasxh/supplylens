                - heading "FAQDirect link to FAQ" [level=2] [ref=e365]:
                  - text: FAQ
                  - link "Direct link to FAQ":
                    - /url: "#faq"
                - paragraph [ref=e366]:
                  - strong [ref=e367]: "Q: What's the maximum number of results returned?"
                  - text: "A: The number of results varies based on the query and what's available. Typically, you'll receive 5-15 results per search."
                - paragraph [ref=e368]:
                  - strong [ref=e369]: "Q: Can I paginate through results?"
                  - text: "A: Currently, pagination is not supported. Each search returns a single page of results."
                - paragraph [ref=e370]:
                  - strong [ref=e371]: "Q: How long does a search take?"
                  - text: "A: Most searches complete within 2-5 seconds. When using"
                  - code [ref=e372]: fetch_content=true
                  - text: ", the request may take longer as it needs to fetch the content of each URL."
                - paragraph [ref=e373]:
                  - strong [ref=e374]: "Q: What happens if the search service is down?"
                  - text: "A: You'll receive a 500 error with an appropriate error message. Your credits will not be deducted for failed requests."
                - paragraph [ref=e375]:
                  - strong [ref=e376]: "Q: Can I search for specific file types or domains?"
                  - text: "A: Yes, you can either use the"
                  - code [ref=e377]: site
                  - text: parameter to restrict results to a specific domain, or use standard search operators in your query (e.g.,
                  - code [ref=e378]: "\"site:github.com\""
                  - text: or
                  - code [ref=e379]: "\"filetype:pdf\""
                  - text: ).
                - paragraph [ref=e380]:
                  - strong [ref=e381]: "Q: How do I filter results by date?"
                  - text: "A: Use the"
                  - code [ref=e382]: startDate
                  - text: and
                  - code [ref=e383]: endDate
                  - text: parameters with Unix timestamps. Both parameters are optional, but if both are provided,
                  - code [ref=e384]: startDate
                  - text: must be less than
                  - code [ref=e385]: endDate
                  - text: .
                - paragraph [ref=e386]:
                  - strong [ref=e387]: "Q: What date format should I use?"
                  - text: "A: Use Unix timestamps (seconds since epoch). For example, October 7, 2024 would be"
                  - code [ref=e388]: "1728259200"
                  - text: .
                - paragraph [ref=e389]:
                  - strong [ref=e390]:
                    - text: "Q: What does the"
                    - code [ref=e391]: fetch_content
